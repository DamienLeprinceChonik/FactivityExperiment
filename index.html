<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Expérience Panthéon Sorbonne LEPRINCE-CHONIK</title>
        <link rel="stylesheet" href="jspsych/dist/jspsych.css">
        <script src="jspsych/dist/jspsych.js"></script>
        <script src="jspsych/dist/plugin-html-button-response.js"></script>
        <script src="jspsych/dist/plugin-html-slider-response.js"></script>
        <script src="jspsych/dist/plugin-survey-text.js"></script>
        <script src="jspsych/dist/plugin-survey-multi-choice.js"></script>
        <script src="jspsych/dist/plugin-survey-likert.js"></script>
        <script src="jspsych/dist/plugin-preload.js"></script>
    </head>
    <body>
        <script>
            // Initialization
            const jsPsych = initJsPsych();

            const timeline = [];

            // Pre-loading images 
            const prelaod = {
                type: jsPsychPreload,
                images: [
                    "Images/Item1/Item1Control.png",
                    "Images/Item1/Item1Factive.png",
                    "Images/Item1/Item1NonFactive.png",
                    "Images/Item2/Item2Control.png",
                    "Images/Item2/Item2Factive.png",
                    "Images/Item2/Item2NonFactive.png",
                    "Images/Item3/Item3Control.png",
                    "Images/Item3/Item3Factive.png",
                    "Images/Item3/Item3NonFactive.png",
                    "Images/Item4/Item4Control.png",
                    "Images/Item4/Item4Factive.png",
                    "Images/Item4/Item4NonFactive.png"
                ]
            };

            // Welcome message
            const welcome = {
                type: jsPsychHtmlButtonResponse,
                stimulus:`
                <div style="text-align:center; max-width:700px; margin:auto;">
                    <h1>Bienvenue !</h1>
                    <p>
                        Merci à vous de participer à cette étude ! Cette expérience est conduite par Leprince-Chonik Damien dans le cadre de sa thèse de M1 pour le Master Economie et Psychologie de l'Ecole d'économie de Paris, réalisée sous la supervision de Bastien Blain (Panthéon-Sorbonne).
                    </p>
                    <p>
                        <b>Objectif:</b> mieux comprendre l'impact des médias sur la perception des conflits internationaux. Il n'y a aucun piège dans cette étude, répondez sincèrement.
                    </p>
                        <b>Déroulement de l'expérience (~15 min):</b>
                        <ul style="text-align:left; display:inline-block;">
                            <li>1er temps : questions démographiques (~1 min)</li>
                            <li>2nd temps : quiz de 18 questions sur les conflits internationaux (~5 min)</li>
                            <li>3ème temps : évaluation de l'objectivité perçue et du ressenti de 16 titres de presse (~8 min)</li>
                        </ul>
                        <p>
                        Votre participation est volontaire et anonyme. Aucun risque de danger n'est associé à cette expérience. <br>
                        Vous pouvez me contacter à cette adresse mail: damien.leprincepro@gmail.com en cas de besoin. 
                    </p>
                    <p>
                        En cliquant sur la flèche ci-dessous, vous acceptez de participer à cette expérience.
                    </p>
                </div>
                `,
                choices: ['<span style="font-size: 40px;">➔</span>'],
            };
            timeline.push(welcome);

            // Pool of stimuli
            const stimuli = [
                {
                id: 1,
                 variants: {
                    control: {
                        news: "Images/Item1/Item1Control.png",
                        questionvalence: "Savoir que le groupe armé M23 entrave l'accès aux zones qu'ils contrôlent vous provoque un sentiment:"
                    },
                    factive: {
                        news: "Images/Item1/Item1Factive.png",
                        questionvalence: "Savoir que l'ONU déplore que le groupe armé M23 entrave l'accès aux zones qu'ils contrôlent vous provoque un sentiment:"
                    },
                    non_factive: {
                        news: "Images/Item1/Item1NonFactive.png",
                        questionvalence: "Savoir que l'ONU accuse le groupe armé M23 d'entraver l'accès aux zones qu'ils contrôlent vous provoque un sentiment:"
                    }
                 },
                 question: "À combien de % pensez-vous qu'il existe une vérité objective sur le fait que le M23 entrave l’accès aux zones qu’ils contrôlent ? (0% étant purement une question d'opinion et 100% purement une question de fait)",
                 detail: "detail RDC" 
                },

                {
                id: 2,
                 variants: {
                    control: {
                        news: "Images/Item2/Item2Control.png",
                        questionvalence: "Savoir que la Russie bloque l'aide aux sinistrés du barrage de Kakhovka vous provoque un sentiment:"
                    },
                    factive: {
                        news: "Images/Item2/Item2Factive.png",
                        questionvalence: "Savoir que l'ONU déplore que la Russie bloque l'aide aux sinistrés du barrage de Kakhovka vous provoque un sentiment:"
                    },
                    non_factive: {
                        news: "Images/Item2/Item2NonFactive.png",
                        questionvalence: "Savoir que l'ONU accuse la Russie de bloquer l'aide aux sinistrés du barrage de Kakhovka vous provoque un sentiment:"
                    }
                 },
                 question: "À combien de % pensez-vous qu'il existe une vérité objective sur le fait que la Russie bloque l'aide aux sinistrés du barrage de Kakhovka ? (0% étant purement une question d'opinion et 100% purement une question de fait)",
                 detail: "detail Ukraine" 
                },

                {
                id: 3,
                 variants: {
                    control: {
                        news: "Images/Item3/Item3Control.png",
                        questionvalence: "Savoir qu'il y a des négociations autour d'un cessez-le-feu durable vous provoque un sentiment:"
                    },
                    factive: {
                        news: "Images/Item3/Item3Factive.png",
                        questionvalence: "Savoir que l'ONU prend en compte les négociations autour d'un 'cessez-le-feu' durable vous provoque un sentiment:"
                    },
                    non_factive: {
                        news: "Images/Item3/Item3NonFactive.png",
                        questionvalence: "Savoir que l'ONU affirme qu'il y a des négociations autour d'un 'cessez-le-feu durable' vous provoque un sentiment:"
                    }
                 },
                 question: "À combien de % pensez-vous qu'il existe une vérité objective sur le fait qu'il y a des négociations autour d'un 'cessez-le-feu durable' ?",
                 detail: "detail Libye" 
                },

                {
                id: 4,
                 variants: {
                    control: {
                        news: "Images/Item4/Item4Control.png",
                        questionvalence: "Savoir que les groupes armés provoquent une détérioration de la situation à Béni vous provoque un sentiment:"
                    },
                    factive: {
                        news: "Images/Item4/Item4Factive.png",
                        questionvalence: "Savoir que l’ONU déplore que les groupes armés provoquent une détérioration de la situation à Béni vous provoque un sentiment:"
                    },
                    non_factive: {
                        news: "Images/Item4/Item4NonFactive.png",
                        questionvalence: "Savoir que l'ONU accuse les groupes armés de provoquer une détérioration de la situation à Béni vous provoque un sentiment:"
                    }
                 },
                 question: "À combien de % pensez-vous qu'il existe une vérité objective sur le fait que les groupes armés provoquent une détérioration de la situation à Béni ?",
                 detail: "detail RDC 2" 
                }
            ];

            // Initializing money pool
            let Money = 2;
            
            // Randomizing control and treatments 
            let condition = [];

            stimuli.forEach(item => {

                // To randomly choose a condition among control/factive/non-factive
                const variants = ["control", "factive", "non_factive"];
                const chosen_variant = jsPsych.randomization.sampleWithoutReplacement(variants, 1)[0];

                // Adding the final item
                condition.push({
                    item_id: item.id,
                    news: item.variants[chosen_variant].news,
                    questionvalence: item.variants[chosen_variant].questionvalence,
                    question: item.question,
                    detail: item.detail,
                    version: chosen_variant
                });
            });

            // Rndomizing final order of items
            condition = jsPsych.randomization.shuffle(condition);
            
            // Demographics stimulis
            const demographics = {
                timeline: [

                    // 1. Gender
                    {
                        type: jsPsychSurveyMultiChoice,
                        data: {question: "gender"},
                        questions: [
                            { 
                                prompt: "Quel est votre genre ?",
                                options: ['Femme', "Homme", "Non-binaire", "Ne préfère pas répondre"],
                                required: true
                            }
                        ]
                    },

                    // 2. Age
                    {
                        type: jsPsychSurveyText,
                        data: {question: "age"},
                        questions: [
                            {
                                prompt: "Quel est votre âge ? (Répondez en nombre, par exemple: 21)",
                                required: true,
                                input_type: "text",
                            }
                        ]
                    },

                    // 3. Political orientation
                    {
                        type: jsPsychSurveyLikert,
                        data: {question: "political_orientation"},
                        preamble: "<p> Sur le <b>spectre politique</b>, êtes-vous plutôt:",
                        questions: [
                    {
                        prompt: "Si vous ne souhaitez pas répondre, ne validez rien et confirmez votre réponse",
                        labels: ["A l'extrême gauche", "Très à gauche", "A gauche", "Au centre", "A droite", "Très à droite", "A l'extrême droite"],
                        required: false
                    },
                    ],
                    button_label: "Confirmer vos réponses"
                    }
                ]
            };
            timeline.push(demographics);

            // Quizz message
            const quizz_welcome = {
                type: jsPsychHtmlButtonResponse,
                stimulus:`
                <div style="text-align:center; max-width:700px; margin:auto;">
                    <h1>Quizz sur les conflits internationaux (~5 min)</h1>
                    <p>
                        Vous allez répondre à une série de 18 questions sur les conflits internationaux. Il n'y a pas de piège et certaines questions sont dures. N'hésitez pas à répondre que vous ne savez pas, l'objectif étant simplement de savoir quelle est votre niveau d'information sur les différents conflits. 
                    </p>
                    <p>
                        <b>Important:</b> il n'y a qu'une seule bonne réponse par question. Pour la validité de l'étude, merci de n'utiliser aucune ressource extérieure pour répondre. 
                    </p>
                    <p>
                        Veuillez cliquer sur la flèche ci-dessous pour commencer. 
                    </p>
                </div>
                `,
                choices: ['<span style="font-size: 40px;">➔</span>'],
            };
            timeline.push(quizz_welcome);

            // Quizz of knowledge on international conflicts

            // 1.Pool of questions
            const knowledge_quizz = [
                {
                    id: 1,
                    questionQuizz: "Israël/Palestine: Comment appelle-t-on les accords signés dans les années 1990 censés poser les bases d'une solution à deux États et d'une autonomie palestinienne ?",
                    options: [
                        "A) Les accords de Camp David",
                        "B) Les accords d'Oslo",
                        "C) Les accords d'Abraham",
                        "D) Les accords de Genève",
                        "Je ne sais pas"
                    ],
                    correct: 1
                },
                {
                    id: 2,
                    questionQuizz: "Israël/Palestine: Quel est le nom de l'agence des Nations Unies spécifiquement dédiée à l'aide aux réfugiés palestiniens ?",
                    options: [
                        "A) Le HCR (UNHCR)",
                        "B) Le UNPRH",
                        "C) L'UNWRA",
                        "D) L'UNICEF",
                        "Je ne sais pas"
                    ],
                    correct: 2
                },
                {
                    id: 3,
                    questionQuizz: "Russie/Ukraine: Parmi les régions suivantes, laquelle n’a pas été revendiquée ou annexée par la Russie:",
                    options: [
                        "A) Crimée",
                        "B) Donetsk",
                        "C) Louhansk",
                        "D) Lviv",
                        "Je ne sais pas"
                    ],
                    correct: 3
                },
                {
                    id: 4,
                    questionQuizz: "Russie/Ukraine: En quelle année la Russie a lancé l’invasion à grande échelle de l’Ukraine ?",
                    options: [
                        "A) 2020",
                        "B) 2021",
                        "C) 2022",
                        "D) 2023",
                        "Je ne sais pas"
                    ],
                    correct: 3
                },
            ];

            // Operationalizing the Quizz
            const quizz_timeline = {
                timeline: [
                    {
                        type: jsPsychSurveyMultiChoice,
                        questions: function(){
                            const q = jsPsych.timelineVariable('questionQuizz');
                            const opts = jsPsych.timelineVariable('options');
                            return [{
                                prompt: q,
                                options: opts,
                                required: true
                            }];
                        },
                        button_label: "Valider",
                        data: function(){
                            const id = jsPsych.timelineVariable('id', true);
                            return{
                                question: `quizz[${id}]`
                            };
                        }
                    }
                ],
                timeline_variables: knowledge_quizz,
                randomize_order: true
            };
            timeline.push(quizz_timeline)

            // News message
            const news_welcome = {
                type: jsPsychHtmlButtonResponse,
                stimulus:`
                <div style="text-align:center; max-width:700px; margin:auto;">
                    <h1>Évaluation de titre de presse (~8 min)</h1>
                    <p>
                        Vous allez évaluer l'objectivité perçue de 16 titres de presse.  
                    </p>
                    <b>Pour chaque titre, vous aurez 3 étapes:</b>
                        <ul style="text-align:left; display:inline-block;">
                            <li>1er étape : vous évaluez à combien de % l'information d'un titre de presse vous paraît être plutôt une question de fait (100%) ou d'opinion (0%)</li>
                            <li>2nd temps : vous évaluez si l'information vous procure un sentiment plutôt négatif ou positif</li>
                            <li>3ème temps : vous avez la possibilité de dépenser 1 pièce pour avoir un complément d'informations sur le titre de presse que vous avez eu.</li>
                        </ul>
                    <p>
                        <b>Important:</b> vous disposez de <b>8 pièces</b> pour 16 titres. Sans pièce, vous ne pouvez pas consulter d'information supplémentaire. Vous n'êtes pas obligé de dépenser toutes vos pièces. Il n'y a pas de bonne ou mauvaise stratégie pour l'utilisation des pièces, utilisez-les pour avoir davantage d'informations sur les titres qui vous intéressent. Par soucis d'objectivité, les informations supplémentaires sont fournit par le modèle Gemini 3.1 Pro. 
                    </p>
                    <p>
                        Veuillez cliquer sur la flèche ci-dessous pour commencer. 
                    </p>
                </div>
                `,
                choices: ['<span style="font-size: 40px;">➔</span>'],
            };
            timeline.push(news_welcome);

            // Timeline per news stimulus
            const stimulus_timeline = {
                timeline: [
                    
                    // 1. News evaluation
                    {
                        type: jsPsychHtmlSliderResponse,
                        stimulus: function() {
                            let img = jsPsych.timelineVariable('news');
                            let question = jsPsych.timelineVariable('question');
                            return `
                                <div style="text-align:center;">
                                        <img src="${img}" style="max-width:800px;">
                                        <div style="margin: 30px 0;">
                                            <p style="font-style: italic;">${question}</p>
                                            <p>Votre réponse : <b id="valeur-slider">50%</b> / 100%</p>
                                            <p>💰 Pièces restantes : <b>${Money}</b></p>
                                        </div>
                                    </div>`;
                        },  
                        labels: ['0', '20', '40', '60', '80', '100'],
                        min: 0,
                        max: 100,
                        slider_start: 50,
                        step: 1,
                        prompt: "<p> Glissez le curseur pour répondre</p>",
                        button_label: "Confirmer l'évaluation",
                        require_movement: true,
                        // Showing the value of the slider to the particpant
                        on_load: function() {
                            const slider = document.querySelector('#jspsych-html-slider-response-response');
                            const affichage = document.querySelector('#valeur-slider');
                            slider.addEventListener('input', function() {
                                affichage.innerHTML = slider.value + "%";
                            });
                        },
                        data: function(){
                            const id = jsPsych.timelineVariable('item_id', true);
                            return { question: `news[${id}]_evaluation` };
                        }
                    },

                    // 2. Valence evaluation
                    {
                        type: jsPsychHtmlSliderResponse,
                        stimulus: function (){
                            let img = jsPsych.timelineVariable('news');
                            let questionvalence = jsPsych.timelineVariable('questionvalence');
                            return `
                                <div style="text-align:center;">
                                        <img src="${img}" style="max-width:800px;">
                                        <div style="margin: 30px 0;">
                                            <p style="font-style: italic;">${questionvalence}</p>
                                            <p>💰 Pièces restantes : <b>${Money}</b></p>
                                            </div>
                                        </div>`;
                        },
                        labels: ['Très négatif', 'Négatif', 'Un peu négatif', 'Neutre', 'Un peu positif', 'Positif', 'Très positif'],
                        min: 1,
                        max: 7,
                        slider_start: 4,
                        step: 1,
                        prompt: "<p> Glissez le curseur pour répondre</p>",
                        button_label: "Confirmer l'évaluation",
                        require_movement: true,
                        data: function(){
                            const id = jsPsych.timelineVariable('item_id', true);
                            return { question: `news[${id}]_valence` };
                        }
                    },

                    // 3. Does participant want to spend credit to get extra information ? 
                    {
                        type: jsPsychHtmlButtonResponse,
                        stimulus: function() {
                            return `<p>Voulez-vous plus d'informations sur cette actualité ? Cela coûtera 1 pièce. 💰</p>
                                    <p>💰 Pièces restantes : <b>${Money}</b></p>`;
                        },
                        choices: function() {
                            if(Money > 0){
                                return ["Oui", "Non"];
                            } else {
                                return ["Crédit insuffisant"];
                            }
                        },
                        on_finish: function(data){
                            if(Money > 0){
                                data.wants_info = data.response === 0 ? "Oui" : "Non";
                            } else {
                                data.wants_info = "CANT";
                            }
                            if(data.wants_info === "Oui") Money -= 1;
                        },
                        data: function (){
                            const id = jsPsych.timelineVariable('item_id', true);
                            return {
                                question: `news[${id}]_add`,
                                money_pool: Money
                            };
                        }
                    },

                    // 4. Printing news (if answer is yes)
                    {
                        timeline: [{
                            type: jsPsychHtmlSliderResponse,
                            stimulus: function(){
                                let detail = jsPsych.timelineVariable('detail');
                                return `
                                <div style="text-align:center; max-width:700px; margin:auto;">
                                    <p><b>Détails supplémentaires :</b></p>
                                    <p>${detail}</p>

                                    <div style="margin-top:40px;">
                                        <p><i>A quel point ce complément d'information vous a-t-il permis de mieux comprendre le titre de presse ?</i></p>
                                    </div>
                                </div>
                                    `;
                            },
                            labels: [
                                "Pas du tout",
                                "Très peu",
                                "Un peu",
                                "Modérément",
                                "Plutôt",
                                "Beaucoup",
                                "Énormément"
                            ],
                            min: 1,
                            max: 7,
                            slider_start: 4,
                            step: 1,
                            require_movement: true,
                            button_label: "Confirmer",
                            data: function(){
                                const id = jsPsych.timelineVariable('item_id', true);
                                return { question: `news[${id}]_detail_usefulness` };
                            }
                        }],
                        
                        conditional_function: function(){
                            const last_trial = jsPsych.data.get().last(1).values()[0];
                            return last_trial.wants_info === "Oui";
                        }
                    }

                ],
                timeline_variables: condition,
                randomize_order: true
            };
            timeline.push(stimulus_timeline)
            

            // End message
            const end_message = {
                type: jsPsychHtmlButtonResponse,
                stimulus: `
                    <div style="text-align:center; max-width:700px; margin:auto; margin-top:100px;">
                        <h2>Merci pour votre participation !</h2>
                        <p>L'expérience est maintenant terminée.</p>
                        <p>Cliquez sur terminer pour valider vos réponses, puis fermez cette page.</p>
                    </div>
                `,
                choices: ["Terminer"]
            };
            timeline.push(end_message);

            // Launch of the experiment
            jsPsych.run(timeline).then(function(){
                jsPsych.data.get().localSave('csv','mes_donnees_experience.csv');
            });
        </script>
    </body>
</html>
