<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Expérience Panthéon Sorbonne LEPRINCE-CHONIK</title>
        <link rel="stylesheet" href="jspsych/dist/jspsych.css">
        <script src="jspsych/dist/jspsych.js"></script>
        <script src="jspsych/dist/plugin-html-button-response.js"></script>
        <script src="jspsych/dist/plugin-html-slider-response.js"></script>
        <script src="jspsych/dist/plugin-survey-text.js"></script>
        <script src="jspsych/dist/plugin-survey-multi-choice.js"></script>
        <script src="jspsych/dist/plugin-survey-likert.js"></script>
        <script src="jspsych/dist/plugin-preload.js"></script>
    </head>
    <body>
        <script>
            // Initialization
            const jsPsych = initJsPsych();

            const timeline = [];

            // Pre-loading images 
            const prelaod = {
                type: jsPsychPreload,
                images: [
                    "Images/Item1/Item1Control.png",
                    "Images/Item1/Item1Factive.png",
                    "Images/Item1/Item1NonFactive.png",
                    "Images/Item2/Item2Control.png",
                    "Images/Item2/Item2Factive.png",
                    "Images/Item2/Item2NonFactive.png",
                    "Images/Item3/Item3Control.png",
                    "Images/Item3/Item3Factive.png",
                    "Images/Item3/Item3NonFactive.png"
                ]
            };

            // Welcome message
            const welcome = {
                type: jsPsychHtmlButtonResponse,
                stimulus:`
                <h1> Introduction </h1>
                `,
                choices: ['<span style="font-size: 40px;">➔</span>'],
            };
            timeline.push(welcome);

            // Pool of stimuli
            const stimuli = [
                {
                id: 1,
                 variants: {
                    control: {
                        news: "Images/Item1/Item1Control.png",
                        questionvalence: "Savoir que le groupe armé M23 entrave l'accès aux zones qu'ils contrôlent vous provoque un sentiment:"
                    },
                    factive: {
                        news: "Images/Item1/Item1Factive.png",
                        questionvalence: "Savoir que l'ONU déplore que le groupe armé M23 entrave l'accès aux zones qu'ils contrôlent vous provoque un sentiment:"
                    },
                    non_factive: {
                        news: "Images/Item1/Item1NonFactive.png",
                        questionvalence: "Savoir que l'ONU accuse le groupe armé M23 d'entraver l'accès aux zones qu'ils contrôlent vous provoque un sentiment:"
                    }
                 },
                 question: "À combien de % pensez-vous qu'il existe une vérité objective sur le fait que le M23 entrave l’accès aux zones qu’ils contrôlent ? (0% étant purement une question d'opinion et 100% purement une question de fait)",
                 detail: "detail RDC" 
                },

                {
                id: 2,
                 variants: {
                    control: {
                        news: "Images/Item2/Item2Control.png",
                        questionvalence: "Savoir que la Russie bloque l'aide aux sinistrés du barrage de Kakhovka vous provoque un sentiment:"
                    },
                    factive: {
                        news: "Images/Item2/Item2Factive.png",
                        questionvalence: "Savoir que l'ONU déplore que la Russie bloque l'aide aux sinistrés du barrage de Kakhovka vous provoque un sentiment:"
                    },
                    non_factive: {
                        news: "Images/Item2/Item2NonFactive.png",
                        questionvalence: "Savoir que l'ONU accuse la Russie de bloquer l'aide aux sinistrés du barrage de Kakhovka vous provoque un sentiment:"
                    }
                 },
                 question: "À combien de % pensez-vous qu'il existe une vérité objective sur le fait que la Russie bloque l'aide aux sinistrés du barrage de Kakhovka ? (0% étant purement une question d'opinion et 100% purement une question de fait)",
                 detail: "detail Ukraine" 
                },

                {
                id: 3,
                 variants: {
                    control: {
                        news: "Images/Item3/Item3Control.png",
                        questionvalence: "Savoir qu'il y a des négociations autour d'un cessez-le-feu durable vous provoque un sentiment:"
                    },
                    factive: {
                        news: "Images/Item3/Item3Factive.png",
                        questionvalence: "Savoir que l'ONU prend en compte les négociations autour d'un 'cessez-le-feu' durable vous provoque un sentiment:"
                    },
                    non_factive: {
                        news: "Images/Item3/Item3NonFactive.png",
                        questionvalence: "Savoir que l'ONU affirme qu'il y a des négociations autour d'un 'cessez-le-feu durable' vous provoque un sentiment:"
                    }
                 },
                 question: "À combien de % pensez-vous qu'il existe une vérité objective sur le fait qu'il y a des négociations autour d'un 'cessez-le-feu durable' ?",
                 detail: "detail Libye" 
                }
            ];

            // Initializing money pool
            let Money = 2;
            
            // Randomizing control and treatments 
            let condition = [];

            stimuli.forEach(item => {

                // To randomly choose a condition among control/factive/non-factive
                const variants = ["control", "factive", "non_factive"];
                const chosen_variant = jsPsych.randomization.sampleWithoutReplacement(variants, 1)[0];

                // Adding the final item
                condition.push({
                    item_id: item.id,
                    news: item.variants[chosen_variant].news,
                    questionvalence: item.variants[chosen_variant].questionvalence,
                    question: item.question,
                    detail: item.detail,
                    version: chosen_variant
                });
            });

            // Rndomizing final order of items
            condition = jsPsych.randomization.shuffle(condition);
            
            // Demographics stimulis
            const demographics = {
                timeline: [

                    // 1. Gender
                    {
                        type: jsPsychSurveyMultiChoice,
                        questions: [
                            { 
                                prompt: "Quel est votre genre ?",
                                options: ['Femme', "Homme", "Non-binaire", "Ne préfère pas répondre"],
                                required: true
                            }
                        ]
                    },

                    // 2. Age
                    {
                        type: jsPsychSurveyText,
                        questions: [
                            {
                                prompt: "Quel est votre âge ? (Répondez en nombre, par exemple: 21)",
                                required: true,
                                input_type: "text",
                            }
                        ]
                    },

                    // 3. Political orientation
                    {
                        type: jsPsychSurveyLikert,
                        preamble: "<p> Sur le <b>spectre politique</b>, êtes-vous plutôt:",
                        questions: [
                    {
                        prompt: "Si vous ne souhaitez pas répondre, ne validez rien et confirmez votre réponse",
                        labels: ["A l'extrême gauche", "Très à gauche", "A gauche", "Au centre", "A droite", "Très à droite", "A l'extrême droite"],
                        required: false
                    },
                    ],
                    button_label: "Confirmer vos réponses"
                    }
                ]
            };
            timeline.push(demographics);

            // Quizz of knowledge on international conflicts

            // 1.Pool of questions
            const knowledge_quizz = [
                {
                    id: 1,
                    questionQuizz: "Israël/Palestine: Comment appelle-t-on les accords signés dans les années 1990 censés poser les bases d'une solution à deux États et d'une autonomie palestinienne ?",
                    options: [
                        "A) Les accords de Camp David",
                        "B) Les accords d'Oslo",
                        "C) Les accords d'Abraham",
                        "D) Les accords de Genève",
                        "Je ne sais pas"
                    ],
                    correct: 1
                },
                {
                    id: 2,
                    questionQuizz: "Israël/Palestine: Quel est le nom de l'agence des Nations Unies spécifiquement dédiée à l'aide aux réfugiés palestiniens ?",
                    options: [
                        "Le HCR (UNHCR)",
                        "Le UNPRH",
                        "L'UNWRA",
                        "L'UNICEF",
                        "Je ne sais pas"
                    ],
                    correct: 2
                },
            ];

            // Operationalizing the Quizz
            const quizz_timeline = {
                timeline: [
                    {
                        type: jsPsychSurveyMultiChoice,
                        questions: function(){
                            const q = jsPsych.timelineVariable('questionQuizz');
                            const opts = jsPsych.timelineVariable('options');
                            return [{
                                prompt: q,
                                options: opts,
                                required: true
                            }];
                        },
                        button_label: "Valider"
                    }
                ],
                timeline_variables: knowledge_quizz,
                randomize_order: true
            };
            timeline.push(quizz_timeline)

            // Timeline per news stimulus
            const stimulus_timeline = {
                timeline: [
                    
                    // 1. News evaluation
                    {
                        type: jsPsychHtmlSliderResponse,
                        stimulus: function() {
                            let img = jsPsych.timelineVariable('news');
                            let question = jsPsych.timelineVariable('question');
                            return `
                                <div style="text-align:center;">
                                        <img src="${img}" style="max-width:800px;">
                                        <div style="margin: 30px 0;">
                                            <p style="font-style: italic;">${question}</p>
                                            <p>Votre réponse : <b id="valeur-slider">50%</b> / 100%</p>
                                            <p>💰 Pièces restantes : <b>${Money}</b></p>
                                        </div>
                                    </div>`;
                        },  
                        labels: ['0', '20', '40', '60', '80', '100'],
                        min: 0,
                        max: 100,
                        slider_start: 50,
                        step: 1,
                        prompt: "<p> Glissez le curseur pour répondre</p>",
                        button_label: "Confirmer l'évaluation",
                        require_movement: true,
                        // Showing the value of the slider to the particpant
                        on_load: function() {
                            const slider = document.querySelector('#jspsych-html-slider-response-response');
                            const affichage = document.querySelector('#valeur-slider');
                            slider.addEventListener('input', function() {
                                affichage.innerHTML = slider.value + "%";
                            });
                        }
                    },

                    // 2. Valence evaluation
                    {
                        type: jsPsychHtmlSliderResponse,
                        stimulus: function (){
                            let img = jsPsych.timelineVariable('news');
                            let questionvalence = jsPsych.timelineVariable('questionvalence');
                            return `
                                <div style="text-align:center;">
                                        <img src="${img}" style="max-width:800px;">
                                        <div style="margin: 30px 0;">
                                            <p style="font-style: italic;">${questionvalence}</p>
                                            <p>💰 Pièces restantes : <b>${Money}</b></p>
                                            </div>
                                        </div>`;
                        },
                        labels: ['Très négatif', 'Négatif', 'Un peu négatif', 'Neutre', 'Un peu positif', 'Positif', 'Très positif'],
                        min: 1,
                        max: 7,
                        slider_start: 4,
                        step: 1,
                        prompt: "<p> Glissez le curseur pour répondre</p>",
                        button_label: "Confirmer l'évaluation",
                        require_movement: true,
                    },

                    // 3. Does participant want to spend credit to get extra information ? 
                    {
                        type: jsPsychHtmlButtonResponse,
                        stimulus: function() {
                            return `<p>Voulez-vous plus d'informations sur cette actualité ? Cela coûtera 1 pièce. 💰</p>
                                    <p>💰 Pièces restantes : <b>${Money}</b></p>`;
                        },
                        choices: function() {
                            if(Money > 0){
                                return ["Oui", "Non"];
                            } else {
                                return ["Crédit insuffisant"];
                            }
                        },
                        on_finish: function(data){
                            if(Money > 0){
                                data.wants_info = data.response === 0; 
                                if(data.wants_info) Money -= 1;
                            } else {
                                data.wants_info = false;
                            }
                        }
                    },

                    // 4. Printing news (if answer is yes)
                    {
                        timeline: [{
                            type: jsPsychHtmlButtonResponse,
                            stimulus: function(){
                                let detail = jsPsych.timelineVariable('detail');
                                return `<p>Détails supplémentaires : ${detail}</p>`;
                            },
                            choices: ["Continuer"]
                        }],
                        conditional_function: function(){
                            const last_trial = jsPsych.data.get().last(1).values()[0];
                            return last_trial.wants_info;
                        }
                    }

                ],
                timeline_variables: condition,
                randomize_order: true
            };
            timeline.push(stimulus_timeline)
      
            // Launch of the experiment
            jsPsych.run(timeline);
        </script>
    </body>
</html>
