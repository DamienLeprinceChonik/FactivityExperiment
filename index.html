                {
                    id: 10,
                    questionQuizz: "La guerre civile syrienne a commencé en :",
                    options: [
                        "A) 2006",
                        "B) 2016",
                        "C) 2011",
                        "D) 2021",
                        "Je ne sais pas"
                    ],
                    correct: 2
                },
                {
                    id: 11,
                    questionQuizz: "Quelle est la capitale de l’Afghanistan ?",
                    options: [
                        "A) Islamabad",
                        "B) Kaboul",
                        "C) Kinshasa",
                        "D) Douchanbé",
                        "Je ne sais pas"
                    ],
                    correct: 1
                },
                {
                    id: 12,
                    questionQuizz: "Quel groupe est connu pour avoir dirigé l’Afghanistan après 2021 ?",
                    options: [
                        "A) Boko Haram",
                        "B) Al-Shabaab",
                        "C) Etat Islamique",
                        "D) Taliban",
                        "Je ne sais pas"
                    ],
                    correct: 3
                },
                {
                    id: 13,
                    questionQuizz: "Quel groupe contrôle principalement le nord du Yémen ?",
                    options: [
                        "A) Boko Haram",
                        "B) Houthis",
                        "C) Al-Shabaab",
                        "D) Les Forces de soutien rapide (FSR)",
                        "Je ne sais pas"
                    ],
                    correct: 1
                },
                {
                    id: 14,
                    questionQuizz: "Le conflit au Yémen est principalement :",
                    options: [
                        "A) Deux forces militaires yéménites",
                        "B) Le Yémen et l’Arabie Saoudite",
                        "C) Le Yémen et l’Iran",
                        "D) Le Yémen et les Émirats",
                        "Je ne sais pas"
                    ],
                    correct: 0
                },
                {
                    id: 15,
                    questionQuizz: "Le conflit libyen oppose principalement :",
                    options: [
                        "A) La Libye et l’Égypte",
                        "B) La Libye et la Tunisie",
                        "C) Deux forces militaires libyennes",
                        "D) La Libye et le Chad",
                        "Je ne sais pas"
                    ],
                    correct: 2
                },
                {
                    id: 16,
                    questionQuizz: "Quel dirigeant était à la tête de la Libye avant 2011 ?",
                    options: [
                        "A) Mahmoud Ahmadinejad",
                        "B) Abdel Fattah el-Sisi",
                        "C) Hosni Mubarak",
                        "D) Mouammar Kadhafi",
                        "Je ne sais pas"
                    ],
                    correct: 3
                },
                {
                    id: 17,
                    questionQuizz: "Quel dirigeant nord-coréen est au pouvoir depuis 2011 et dirige le pays actuellement ?",
                    options: [
                        "A) Moon Jae-in",
                        "B) Lee Myung-bak",
                        "C) Kim Il-sung",
                        "D) Kim Jong-un",
                        "Je ne sais pas"
                    ],
                    correct: 3
                },
                {
                    id: 18,
                    questionQuizz: "Récemment, quel type d’événement a secoué la Corée du Sud ?",
                    options: [
                        "A) Un sommet international",
                        "B) Une tentative de coup d’État",
                        "C) Une élection présidentielle",
                        "D) Une catastrophe naturelle",
                        "Je ne sais pas"
                    ],
                    correct: 3
                },
            ];

            // Operationalizing the Quizz
            const quizz_timeline = {
                timeline: [
                    {
                        type: jsPsychSurveyMultiChoice,
                        questions: function(){
                            const q = jsPsych.timelineVariable('questionQuizz');
                            const opts = jsPsych.timelineVariable('options');
                            return [{
                                prompt: q,
                                options: opts,
                                required: true
                            }];
                        },
                        button_label: "Valider",
                        data: function(){
                            const id = jsPsych.timelineVariable('id', true);
                            return{
                                question: `quizz[${id}]`
                            };
                        }
                    }
                ],
                timeline_variables: knowledge_quizz,
                randomize_order: true
            };
            timeline.push(quizz_timeline)

            // News message
            const news_welcome = {
                type: jsPsychHtmlButtonResponse,
                stimulus:`
                <div style="text-align:center; max-width:700px; margin:auto;">
                    <h1>Évaluation de titre de presse (~8 min)</h1>
                    <p>
                        Vous allez évaluer l'objectivité perçue de 16 titres de presse.  
                    </p>
                    <b>Pour chaque titre, vous aurez 3 étapes:</b>
                        <ul style="text-align:left; display:inline-block;">
                            <li>1er étape : vous évaluez à combien de % l'information d'un titre de presse vous paraît être plutôt une question de fait (100%) ou d'opinion (0%)</li>
                            <li>2nd temps : vous évaluez si l'information vous procure un sentiment plutôt négatif ou positif</li>
                            <li>3ème temps : vous avez la possibilité de dépenser 1 pièce pour avoir un complément d'informations sur le titre de presse que vous avez eu.</li>
                        </ul>
                    <p>
                        <b>Important:</b> vous disposez de <b>8 pièces</b> pour 16 titres. Sans pièce, vous ne pouvez pas consulter d'information supplémentaire. Vous n'êtes pas obligé de dépenser toutes vos pièces. Il n'y a pas de bonne ou mauvaise stratégie pour l'utilisation des pièces, utilisez-les pour avoir davantage d'informations sur les titres qui vous intéressent. Par soucis d'objectivité, les informations supplémentaires sont fournit par le modèle Gemini 3.1 Pro. 
                    </p>
                    <p>
                        Veuillez cliquer sur la flèche ci-dessous pour commencer. 
                    </p>
                </div>
                `,
                choices: ['<span style="font-size: 40px;">➔</span>'],
            };
            timeline.push(news_welcome);

            // Timeline per news stimulus
            const stimulus_timeline = {
                timeline: [
                    
                    // 1. News evaluation
                    {
                        type: jsPsychHtmlSliderResponse,
                        stimulus: function() {
                            let img = jsPsych.timelineVariable('news');
                            let question = jsPsych.timelineVariable('question');
                            return `
                                <div style="text-align:center;">
                                        <img src="${img}" style="max-width:800px;">
                                        <div style="margin: 30px 0;">
                                            <p style="font-style: italic;">${question}</p>
                                            <p>Votre réponse : <b id="valeur-slider">50%</b> / 100%</p>
                                            <p>💰 Pièces restantes : <b>${Money}</b></p>
                                        </div>
                                    </div>`;
                        },  
                        labels: ['0', '20', '40', '60', '80', '100'],
                        min: 0,
                        max: 100,
                        slider_start: 50,
                        step: 1,
                        prompt: "<p> Glissez le curseur pour répondre</p>",
                        button_label: "Confirmer l'évaluation",
                        require_movement: true,
                        // Showing the value of the slider to the particpant
                        on_load: function() {
                            const slider = document.querySelector('#jspsych-html-slider-response-response');
                            const affichage = document.querySelector('#valeur-slider');
                            slider.addEventListener('input', function() {
                                affichage.innerHTML = slider.value + "%";
                            });
                        },
                        data: function(){
                            const id = jsPsych.timelineVariable('item_id', true);
                            return { question: `news[${id}]_evaluation` };
                        }
                    },

                    // 2. Valence evaluation
                    {
                        type: jsPsychHtmlSliderResponse,
                        stimulus: function (){
                            let img = jsPsych.timelineVariable('news');
                            let questionvalence = jsPsych.timelineVariable('questionvalence');
                            return `
                                <div style="text-align:center;">
                                        <img src="${img}" style="max-width:800px;">
                                        <div style="margin: 30px 0;">
                                            <p style="font-style: italic;">${questionvalence}</p>
                                            <p>💰 Pièces restantes : <b>${Money}</b></p>
                                            </div>
                                        </div>`;
                        },
                        labels: ['Très négatif', 'Négatif', 'Un peu négatif', 'Neutre', 'Un peu positif', 'Positif', 'Très positif'],
                        min: 1,
                        max: 7,
                        slider_start: 4,
                        step: 1,
                        prompt: "<p> Glissez le curseur pour répondre</p>",
                        button_label: "Confirmer l'évaluation",
                        require_movement: true,
                        data: function(){
                            const id = jsPsych.timelineVariable('item_id', true);
                            return { question: `news[${id}]_valence` };
                        }
                    },

                    // 3. Does participant want to spend credit to get extra information ? 
                    {
                        type: jsPsychHtmlButtonResponse,
                        stimulus: function() {
                            return `<p>Voulez-vous plus d'informations sur cette actualité ? Cela coûtera 1 pièce. 💰</p>
                                    <p>💰 Pièces restantes : <b>${Money}</b></p>`;
                        },
                        choices: function() {
                            if(Money > 0){
                                return ["Oui", "Non"];
                            } else {
                                return ["Crédit insuffisant"];
                            }
                        },
                        on_finish: function(data){
                            if(Money > 0){
                                data.wants_info = data.response === 0 ? "Oui" : "Non";
                            } else {
                                data.wants_info = "CANT";
                            }
                            if(data.wants_info === "Oui") Money -= 1;
                        },
                        data: function (){
                            const id = jsPsych.timelineVariable('item_id', true);
                            return {
                                question: `news[${id}]_add`,
                                money_pool: Money
                            };
                        }
                    },

                    // 4. Printing news (if answer is yes)
                    {
                        timeline: [{
                            type: jsPsychHtmlSliderResponse,
                            stimulus: function(){
                                let detail = jsPsych.timelineVariable('detail');
                                return `
                                <div style="text-align:center; max-width:700px; margin:auto;">
                                    <p><b>Détails supplémentaires (fournis par le modèle Gemini 3.1 Pro) :</b></p>
                                    <p>${detail}</p>
                                    <div style="margin-top:40px;">
                                        <p><i>A quel point ce complément d'information vous a-t-il permis de mieux comprendre le titre de presse ?</i></p>
                                    </div>
                                </div>
                                    `;
                            },
                            labels: [
                                "Pas du tout",
                                "Très peu",
                                "Un peu",
                                "Modérément",
                                "Plutôt",
                                "Beaucoup",
                                "Énormément"
                            ],
                            min: 1,
                            max: 7,
                            slider_start: 4,
                            step: 1,
                            require_movement: true,
                            button_label: "Confirmer",
                            data: function(){
                                const id = jsPsych.timelineVariable('item_id', true);
                                return { question: `news[${id}]_detail_usefulness` };
                            }
                        }],

                        conditional_function: function(){
                            const last_trial = jsPsych.data.get().last(1).values()[0];
                            return last_trial.wants_info === "Oui";
                        }
                    }

                ],
                timeline_variables: condition,
                randomize_order: true
            };
            timeline.push(stimulus_timeline)
            

            // End message
            const end_message = {
                type: jsPsychHtmlButtonResponse,
                stimulus: `
                    <div style="text-align:center; max-width:700px; margin:auto; margin-top:100px;">
                        <h2>Merci pour votre participation !</h2>
                        <p>L'expérience est maintenant terminée.</p>
                        <p>Cliquez sur terminer pour valider vos réponses, puis fermez cette page.</p>
                    </div>
                `,
                choices: ["Terminer"]
            };
            timeline.push(end_message);

            // Launch of the experiment
            jsPsych.run(timeline).then(function(){
                jsPsych.data.get().localSave('csv','mes_donnees_experience.csv');
            });
        </script>
    </body>
</html>
